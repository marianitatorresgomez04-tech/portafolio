<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>portafolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===============================
       PRIMER BLOQUE - MOUSE TRAIL
       =============================== -->
  <div id="background">
    <div id="hiddenText">Everything fades. Nothing lasts. Just a snake eating its own tail</div>
    <canvas id="trailCanvas"></canvas>
  </div>

  <!-- ===============================
       SEGUNDO BLOQUE - PUERTAS
       =============================== -->
  <section id="doorsSection">
    <div class="doorRow">
      <div class="doorContainer">
        <div class="door" style="background-image: url('maca 1.jpeg');"></div>
        <h3 class="doorTitle">Proyecto 1</h3>
      </div>
      <div class="doorContainer">
        <div class="door" style="background-image: url('maca 1.jpeg');"></div>
        <h3 class="doorTitle">Proyecto 2</h3>
      </div>
    </div>
    <div class="doorRow">
      <div class="doorContainer">
        <div class="door" style="background-image: url('maca 1.jpeg');"></div>
        <h3 class="doorTitle">Proyecto 3</h3>
      </div>
      <div class="doorContainer">
        <div class="door" style="background-image: url('maca 1.jpeg');"></div>
        <h3 class="doorTitle">Proyecto 4</h3>
      </div>
    </div>
  </section>


  <!-- ===============================
       SCRIPT MOUSE TRAIL
       =============================== -->
  <script>
    const canvas = document.getElementById('trailCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // Capa oscura inicial
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, width, height);

    const trails = [];

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, width, height);
    });

    window.addEventListener('mousemove', e => {
      trails.push({x: e.clientX, y: e.clientY, radius: 50, alpha: 1});
    });

    function animate() {
      // Fondo semi-transparente para efecto rastro
      ctx.fillStyle = 'rgba(17,17,17,0.05)';
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = 'destination-out';

      for (let i = 0; i < trails.length; i++) {
        const t = trails[i];
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0,0,0,${t.alpha})`;
        ctx.fill();
        t.alpha -= 0.02;
        if (t.alpha <= 0) trails.splice(i,1);
      }

      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
